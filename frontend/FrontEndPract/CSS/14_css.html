<!DOCTYPE html>
<html>
<head>
<style>

/* Mobile (default) */
.box {
  background: lightcoral;
  padding: 20px;
}

/* Tablet */
@media (min-width: 768px) {
  .box {
    background: lightblue;
  }
}

/* Laptop */
@media (min-width: 1024px) {
  .box {
    background: lightgreen;
  }
}

</style>
</head>
<body>

<div class="box">Responsive Box</div>

</body>
</html>
