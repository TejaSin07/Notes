<!DOCTYPE html>
<html>
<body>

  <h2>Image</h2>
  <img src="image.jpg" alt="Sample image" width="200" loading="lazy">

  <h2>Video</h2>
  <video controls width="300">
    <source src="video.mp4" type="video/mp4">
  </video>

  <h2>Audio</h2>
  <audio controls>
    <source src="audio.mp3" type="audio/mpeg">
  </audio>

  <h2>Iframe</h2>
  <iframe 
    src="https://example.com" 
    title="Example site"
    width="300" 
    height="200"
    loading="lazy">
  </iframe>

</body>
</html>
